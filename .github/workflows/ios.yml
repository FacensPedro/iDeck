name: iOS Build

on:
  workflow_dispatch:
    inputs:
      require_madeira:
        description: "Require real FEX/Wine/DXMT/D3D12 binaries and linked bridge (no UI-only IPA)"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Publish a GitHub release for this tag (e.g. 0.1.0); empty = build only"
        required: false
        default: ""
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build iDeck IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Build and package iDeck.ipa
        env:
          IDECK_REQUIRE_MADEIRA: ${{ inputs.require_madeira && '1' || '0' }}
        run: |
          set -o pipefail
          bash scripts/build_ipa.sh 2>&1 | tee build.log || status=$?
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          exit ${status:-0}

      - name: Verify IPA archive
        run: |
          test -s iDeck.ipa
          unzip -tq iDeck.ipa

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDeck
          path: iDeck.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" iDeck.ipa --clobber
          else
            gh release create "$TAG" iDeck.ipa --target "${{ github.sha }}" --title "iDeck $TAG" --generate-notes
          fi
