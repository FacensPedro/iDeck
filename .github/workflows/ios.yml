name: iOS Build

on:
  workflow_dispatch:
    inputs:
      require_madeira:
        description: "Require real FEX/Wine/DXMT/D3D12 binaries and linked bridge (no UI-only IPA)"
        type: boolean
        required: false
        default: false
      accept_converter_license:
        description: "I have reviewed the Metal Shader Converter terms and have permission to package the converter in this IPA"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Publish a GitHub release for this tag (e.g. 0.1.0); empty = build only"
        required: false
        default: ""
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build iDeck IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Validate native runtime requirements
        if: ${{ inputs.require_madeira }}
        env:
          CONVERTER_LICENSE_ACK: ${{ inputs.accept_converter_license && '1' || '0' }}
        run: |
          set -euo pipefail
          if [[ "$CONVERTER_LICENSE_ACK" != "1" ]]; then
            echo "::error::Native build requires reviewing the Apple Metal Shader Converter license and explicitly confirming permission to package the converter."
            exit 2
          fi

      - name: Install Madeira native build dependencies
        if: ${{ inputs.require_madeira }}
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja meson bison pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Madeira with FEX, Wine and DXMT
        if: ${{ inputs.require_madeira }}
        run: bash scripts/fetch_madeira_sources.sh

      - name: Prepare ARM64EC and iOS LLVM toolchains
        if: ${{ inputs.require_madeira }}
        run: bash scripts/prepare_madeira_toolchains.sh

      - name: Build and package iDeck.ipa
        env:
          IDECK_REQUIRE_MADEIRA: ${{ inputs.require_madeira && '1' || '0' }}
          IDECK_ACCEPT_METAL_CONVERTER_LICENSE: ${{ inputs.accept_converter_license && '1' || '0' }}
          IDECK_CONFIGURATION: ${{ inputs.require_madeira && 'Debug' || 'Release' }}
        run: |
          set -o pipefail
          bash scripts/build_ipa.sh 2>&1 | tee build.log || status=$?
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          exit ${status:-0}

      - name: Verify IPA archive
        run: |
          test -s iDeck.ipa
          unzip -tq iDeck.ipa
          if [[ "${{ inputs.require_madeira && '1' || '0' }}" == "1" ]]; then
            python3 - <<'PY'
          import plistlib
          from zipfile import ZipFile

          with ZipFile("iDeck.ipa") as archive:
              prefix = "Payload/iDeck.app/"
              required = (
                  "MadeiraRuntimeManifest.plist",
                  "arm64ec-windows/xtajit64.dll",
                  "arm64ec-windows/d3d12.dll",
                  "arm64ec-windows/d3d12core.dll",
                  "arm64ec-windows/winemetal.dll",
                  "aarch64-windows/d3d11.dll",
                  "aarch64-windows/dxgi.dll",
                  "d3d12/libmetalirconverter.dylib",
                  "prefix-template.tar.gz",
              )
              missing = [name for name in required if prefix + name not in archive.namelist()]
              if missing:
                  raise SystemExit("Missing actual Madeira native IPA resources: " + ", ".join(missing))
              flags = plistlib.loads(archive.read(prefix + "MadeiraRuntimeManifest.plist"))
              if not all(flags.get(key) is True for key in ("fexInProcess", "wineInProcess", "dxmtLinked", "d3d12Linked")):
                  raise SystemExit("Native Madeira manifest is incomplete")
          print("Confirmed IPA includes Madeira native manifest and Windows runtime payload")
          PY
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.require_madeira && 'iDeck-Madeira-native' || 'iDeck-interface-only' }}
          path: iDeck.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Show IPA download instructions
        if: success()
        run: |
          if [[ "${{ inputs.require_madeira && '1' || '0' }}" == "1" ]]; then
            echo '## iDeck Madeira native IPA: static checks passed' >> "$GITHUB_STEP_SUMMARY"
            echo 'The native payload passed build verification, but game execution, JIT and device signing are not verified.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download **iDeck-Madeira-native** under Artifacts.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## iDeck interface-only IPA' >> "$GITHUB_STEP_SUMMARY"
            echo '**Windows games will not run in this IPA. FEX, Wine, DXMT and D3D12 were not compiled or linked.**' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download **iDeck-interface-only** under Artifacts, or manually run this workflow with Require Madeira runtime and the license confirmation.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[Open artifacts for this run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: inputs.require_madeira && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" iDeck.ipa --clobber
          else
            gh release create "$TAG" iDeck.ipa --target "${{ github.sha }}" --title "iDeck $TAG" --generate-notes
          fi
