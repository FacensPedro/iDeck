name: iOS Build

on:
  workflow_dispatch:
    inputs:
      require_madeira:
        description: "Require real FEX/Wine/DXMT/D3D12 binaries and linked bridge (no UI-only IPA)"
        type: boolean
        required: false
        default: true
      accept_converter_license:
        description: "I have reviewed the Metal Shader Converter terms and have permission to package the converter in this IPA"
        type: boolean
        required: false
        default: false
      build_wow64:
        description: "Bundle WoW64 (i386 FEX and Wine) in the native IPA (enabled by default; disable only for 64-bit-only builds)"
        type: boolean
        required: false
        default: true
      bundle_wine_mono:
        description: "Include Wine Mono for compatible .NET Framework applications"
        type: boolean
        required: false
        default: false
      export_runtime_kit:
        description: "Export native runtime ZIP as an artifact for authorized Git LFS storage (requires distribution rights)"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Publish a GitHub release for this tag (e.g. 0.1.0); empty = build only"
        required: false
        default: ""
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build iDeck IPA
    runs-on: xcode-27
    # Native validation is required for this integration PR branch.
    # The branch-scoped rule runs the licensed build after each PR update; release_tag remains empty.
    env:
      IDECK_NATIVE_BUILD: ${{ inputs.require_madeira && '1' || '0' }}
      IDECK_ACCEPT_METAL_CONVERTER_LICENSE: ${{ inputs.accept_converter_license && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Test Metal Toolchain bootstrap
        run: |
          bash -n scripts/ensure_metal_toolchain.sh
          python3 -m unittest discover -s tests/host -p 'test_metal_toolchain.py' -v

      - name: Verify iPhoneOS LLVM linker system libraries
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=18.0 \
            tests/host/NativeIOSLinkDependencies.c \
            -lcurses -lxml2 -o /tmp/ideck-ios-llvm-dependency-check
          test "$(xcrun lipo -archs /tmp/ideck-ios-llvm-dependency-check)" = arm64
          python3 -m unittest discover -s tests/host -p 'test_native_llvm_link.py' -v

      - name: Prevent Swift translation dictionary crash at iDeck launch
        run: |
          python3 -m unittest discover -s tests/host -p 'test_localization_dictionary.py' -v
          xcrun swiftc iDeck/Localization.swift tests/host/LocalizationLaunchSmokeTests.swift -o /tmp/ideck-localization-launch-tests
          /tmp/ideck-localization-launch-tests

      - name: Test automatic Windows runtime settings
        run: python3 -m unittest discover -s tests/host -p 'test_windows_compatibility_localization.py' -v

      - name: Test DXMT shader compatibility patch
        run: |
          bash -n scripts/fetch_madeira_sources.sh
          bash -n scripts/build_madeira_components.sh
          python3 -m unittest discover -s tests/host -p 'test_dxmt_shader_patch.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_game_backports.py' -v

      - name: Test StikDebug universal JIT register encoding
        run: node tests/host/universal_jit_register_tests.js

      - name: Test app cold-start isolation and crash-recovery entry
        run: python3 -m unittest discover -s tests/host -p 'test_launch_startup_isolation.py' -v

      - name: Test FEX iOS allocator archive preparation
        run: |
          bash -n scripts/build_fex_ios_allocator.sh
          python3 -m unittest discover -s tests/host -p 'test_fex_ios_allocator.py' -v

      - name: Test Madeira native symbol ownership
        run: |
          bash -n scripts/link_madeira_native.sh
          python3 -m unittest discover -s tests/host -p 'test_madeira_native_duplicate_symbols.py' -v


      - name: Test native performance C++ modules
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread -x c++ \
            tests/host/NativePerformanceTests.cpp \
            iDeck/NativeRuntime/FEXExecutionScheduler.cpp \
            iDeck/NativeRuntime/GuestMemoryPool.cpp \
            iDeck/NativeRuntime/NativePerformanceClock.cpp \
            iDeck/NativeRuntime/RuntimePerformanceMonitor.mm \
            -o /tmp/ideck-native-performance-tests
          /tmp/ideck-native-performance-tests

      - name: Test native memory budgeting and pressure recovery
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread \
            tests/host/NativeMemoryManagerTests.cpp \
            iDeck/NativeRuntime/NativeMemoryManager.cpp \
            iDeck/NativeRuntime/GuestMemoryPool.cpp \
            -o /tmp/ideck-memory-manager-tests
          /tmp/ideck-memory-manager-tests

      - name: Test live debugger guard for FEX JIT
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread \
            tests/host/FEXJITGuardTests.cpp \
            iDeck/NativeRuntime/FEXRuntime.cpp \
            -o /tmp/ideck-fex-jit-guard-tests
          /tmp/ideck-fex-jit-guard-tests
          python3 -m unittest discover -s tests/host -p 'test_fex_jit_guard.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_ui_jit_upstream.py' -v

      - name: Validate Xcode project source references
        run: python3 -m unittest discover -s tests/host -p 'test_xcode_project.py' -v

      - name: Test native bundle verifier
        run: python3 -m unittest discover -s tests/host -p 'test_madeira_bundle.py' -v

      - name: Verify Windows-compatible native payload staging
        run: |
          bash -n scripts/stage_madeira_payload.sh
          python3 -m unittest discover -s tests/host -p 'test_madeira_payload_staging.py' -v


      - name: Test native regional Steam depot selection
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/SteamDepotRegionPolicyTests.c iDeck/SteamDepotRegionPolicy.c \
            -o /tmp/ideck-steam-region-tests
          /tmp/ideck-steam-region-tests

      - name: Test native Steam disk writer
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/SteamDiskIOTests.c iDeck/SteamDiskIO.c \
            -o /tmp/ideck-steam-disk-tests
          /tmp/ideck-steam-disk-tests

      - name: Test reusable Madeira kit validation and shell build
        run: |
          python3 -m unittest discover -s tests/host -p 'test_madeira_native_kit.py' -v
          python3 -m unittest discover -s tests/host -p 'test_ipa_optional_arrays.py' -v
          bash -n scripts/build_ipa.sh
          bash -n scripts/build_native_runtime.sh

      - name: Test on-device Visual C++ CAB extraction
        run: |
          set -euo pipefail
          mkdir -p /tmp/ideck-vcrt-objects
          for name in cabd cabc system mszipd lzxd qtmd crc32; do
            xcrun clang -std=c99 -D_POSIX_C_SOURCE=200809L \
              -I iDeck/ThirdParty/libmspack \
              -c "iDeck/ThirdParty/libmspack/$name.c" \
              -o "/tmp/ideck-vcrt-objects/$name.o"
          done
          xcrun clang -std=c99 -D_POSIX_C_SOURCE=200809L \
            -I iDeck/ThirdParty/libmspack \
            -c iDeck/NativeRuntime/VCArchiveExtractor.c \
            -o /tmp/ideck-vcrt-objects/VCArchiveExtractor.o
          xcrun clang -std=c99 -I . -c tests/host/VisualCRuntimeCABHostTests.c \
            -o /tmp/ideck-vcrt-objects/VisualCRuntimeCABHostTests.o
          xcrun clang /tmp/ideck-vcrt-objects/*.o -o /tmp/ideck-vcrt-extractor-tests
          python3 tests/host/test_vcrt_cab_extractor.py /tmp/ideck-vcrt-extractor-tests
          xcrun swiftc -import-objc-header iDeck/NativeRuntime/VCArchiveExtractor.h \
            iDeck/VisualCRuntimeBootstrap.swift tests/host/VisualCRuntimeBootstrapTests.swift \
            /tmp/ideck-vcrt-objects/cabd.o /tmp/ideck-vcrt-objects/cabc.o \
            /tmp/ideck-vcrt-objects/system.o /tmp/ideck-vcrt-objects/mszipd.o \
            /tmp/ideck-vcrt-objects/lzxd.o /tmp/ideck-vcrt-objects/qtmd.o \
            /tmp/ideck-vcrt-objects/crc32.o \
            /tmp/ideck-vcrt-objects/VCArchiveExtractor.o -o /tmp/ideck-vcredist-tests
          /tmp/ideck-vcredist-tests

      - name: Test Steam native C crypto and bounded existing-file verification
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/SteamNativeCoreTests.c iDeck/SteamNativeCore.c \
            -o /tmp/ideck-steam-native-tests
          /tmp/ideck-steam-native-tests
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -c iDeck/SteamNativeCore.c \
            -o /tmp/ideck-steam-native-core.o
          xcrun swiftc -import-objc-header iDeck/SteamNativeCore.h \
            iDeck/SteamExistingChunkVerifier.swift tests/host/SteamExistingChunkVerifierTests.swift \
            /tmp/ideck-steam-native-core.o -o /tmp/ideck-steam-existing-chunk-tests
          /tmp/ideck-steam-existing-chunk-tests

      - name: Test bounded native Madeira Wine log diagnostics
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/WineLogTriageTests.c iDeck/NativeRuntime/WineLogTriage.c \
            -o /tmp/ideck-wine-diagnosis-tests
          /tmp/ideck-wine-diagnosis-tests
          python3 -m unittest discover -s tests/host -p 'test_native_steam_performance.py' -v

      - name: Test Steam CDN host performance selection
        run: |
          xcrun swiftc iDeck/SteamCDNHostSelection.swift tests/host/SteamCDNHostSelectionTests.swift -o /tmp/ideck-cdn-selection-tests
          /tmp/ideck-cdn-selection-tests
          python3 -m unittest discover -s tests/host -p 'test_steam_ip_routing.py' -v

      - name: Test graphics DLL override isolation
        run: |
          xcrun swiftc iDeck/GraphicsConfig.swift tests/host/GraphicsOverrideTests.swift -o /tmp/ideck-graphics-override-tests
          /tmp/ideck-graphics-override-tests

      - name: Test Wine game loading and safe close
        run: python3 -m unittest discover -s tests/host -p 'test_wine_startup_session.py' -v

      - name: Test Wine native exit diagnostics and Steam app identity
        run: |
          xcrun swiftc iDeck/WineExitDiagnostics.swift tests/host/WineExitDiagnosticsTests.swift -o /tmp/ideck-wine-exit-tests
          /tmp/ideck-wine-exit-tests
          python3 -m unittest discover -s tests/host -p 'test_madeira_launch_integration.py' -v

      - name: Test Windows launch arguments and path escaping
        run: |
          xcrun swiftc iDeck/WindowsLaunchArguments.swift tests/host/WindowsLaunchArgumentsTests.swift -o /tmp/ideck-launch-args-tests
          /tmp/ideck-launch-args-tests

      - name: Test Steam WebSocket backpressure and graphics readiness diagnostics
        run: python3 -m unittest discover -s tests/host -p 'test_steam_game_launch_diagnostics.py' -v

      - name: Test Husk IPA ZIP extraction
        run: |
          xcrun swiftc iDeck/IPAArchivePath.swift tests/host/IPAArchivePathTests.swift -o /tmp/ideck-ipa-path-tests
          /tmp/ideck-ipa-path-tests
          python3 -m unittest discover -s tests/host -p 'test_husk_zip_extractor.py' -v

      - name: Test rendering configuration and window resizing
        run: |
          xcrun swiftc iDeck/RuntimeConfiguration.swift tests/host/RuntimeConfigurationTests.swift -o /tmp/ideck-runtime-tests
          /tmp/ideck-runtime-tests

      - name: Test Steam library preview cache
        run: |
          xcrun swiftc iDeck/SteamLibraryPreviewCache.swift tests/host/SteamLibraryPreviewCacheTests.swift -o /tmp/ideck-steam-library-cache-tests
          /tmp/ideck-steam-library-cache-tests

      - name: Test guest data containers
        run: |
          xcrun swiftc iDeck/GuestContainerStore.swift tests/host/GuestContainerStoreTests.swift -o /tmp/ideck-container-tests
          /tmp/ideck-container-tests

      - name: Validate native runtime requirements
        if: ${{ env.IDECK_NATIVE_BUILD == '1' }}
        env:
          CONVERTER_LICENSE_ACK: ${{ env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE }}
        run: |
          set -euo pipefail
          if [[ "$CONVERTER_LICENSE_ACK" != "1" ]]; then
            echo "::error::Native build requires reviewing the Apple Metal Shader Converter license and explicitly confirming permission to package the converter."
            exit 2
          fi

      - name: Restore previously compiled Madeira runtime
        if: ${{ env.IDECK_NATIVE_BUILD == '1' }}
        uses: actions/cache@v4
        with:
          path: build/native-cache
          key: madeira-kit-v1-${{ runner.os }}-${{ runner.arch }}-${{ (github.event_name != 'workflow_dispatch' || inputs.build_wow64) && 'wow64' || 'no-wow64' }}-${{ inputs.bundle_wine_mono && 'mono' || 'no-mono' }}-${{ hashFiles('scripts/madeira_native_kit.py', 'scripts/build_madeira_components.sh', 'scripts/link_madeira_native.sh', 'scripts/fetch_madeira_sources.sh', 'patches/*') }}

      - name: Locate repository or cached Madeira runtime
        if: ${{ env.IDECK_NATIVE_BUILD == '1' }}
        id: madeira_kit
        env:
          IDECK_BUILD_WOW64: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_wow64) && '1' || '0' }}
          IDECK_BUNDLE_WINE_MONO: ${{ inputs.bundle_wine_mono && '1' || '0' }}
        run: |
          set -euo pipefail
          OPTIONS=()
          if [[ "$IDECK_BUILD_WOW64" == "1" ]]; then OPTIONS+=(--wow64); fi
          if [[ "$IDECK_BUNDLE_WINE_MONO" == "1" ]]; then OPTIONS+=(--mono); fi
          SOURCE="$(python3 scripts/madeira_native_kit.py path ${OPTIONS[@]+"${OPTIONS[@]}"})"
          CACHE="$(python3 scripts/madeira_native_kit.py path --cache ${OPTIONS[@]+"${OPTIONS[@]}"})"
          if [[ -s "$SOURCE" || -s "$CACHE" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Found native kit: no FEX/Wine/DXMT download or LLVM recompilation necessary."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Compiling Madeira once and caching its binaries for subsequent IPAs."
          fi

      - name: Install and validate Metal Toolchain
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: bash scripts/ensure_metal_toolchain.sh

      - name: Install Madeira native build dependencies
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: |
          set -euo pipefail
          HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake ninja meson bison pkg-config
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Fetch pinned Madeira with FEX, Wine and DXMT
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: bash scripts/fetch_madeira_sources.sh

      - name: Prepare ARM64EC and iOS LLVM toolchains
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: bash scripts/prepare_madeira_toolchains.sh

      - name: Build and package iDeck.ipa
        env:
          IDECK_REQUIRE_MADEIRA: ${{ env.IDECK_NATIVE_BUILD }}
          IDECK_ACCEPT_METAL_CONVERTER_LICENSE: ${{ env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE }}
          IDECK_BUILD_WOW64: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_wow64) && '1' || '0' }}
          IDECK_BUNDLE_WINE_MONO: ${{ inputs.bundle_wine_mono && '1' || '0' }}
          IDECK_PREBUILT_EXPORT: '1'
          IDECK_CONFIGURATION: ${{ env.IDECK_NATIVE_BUILD == '1' && 'Debug' || 'Release' }}
        run: |
          set -o pipefail
          bash scripts/build_ipa.sh 2>&1 | tee build.log || status=$?
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          exit ${status:-0}

      - name: Verify IPA archive
        run: |
          test -s iDeck.ipa
          unzip -tq iDeck.ipa
          unzip -Z1 iDeck.ipa | grep -Fx 'Payload/iDeck.app/universal.js'
          if [[ "${{ env.IDECK_NATIVE_BUILD == '1' && '1' || '0' }}" == "1" ]]; then
            python3 - <<'PY'
          import plistlib
          from zipfile import ZipFile

          with ZipFile("iDeck.ipa") as archive:
              prefix = "Payload/iDeck.app/"
              required = (
                  "MadeiraRuntimeManifest.plist",
                  "arm64ec-windows/xtajit64.dll",
                  "arm64ec-windows/d3d12.dll",
                  "arm64ec-windows/d3d12core.dll",
                  "arm64ec-windows/winemetal.dll",
                  "arm64ec-windows/d3d11.dll",
                  "arm64ec-windows/dxgi.dll",
                  "arm64ec-windows/d3d10core.dll",
                  "arm64ec-windows/dcomp.dll",
                  "arm64ec-windows/ktmw32.dll",
                  "arm64ec-windows/faultrep.dll",
                  "arm64ec-windows/xaudio2_7.dll",
                  "arm64ec-windows/d3dx11_43.dll",
                  "arm64ec-windows/d3dcompiler_47.dll",
                  "arm64ec-windows/dinput8.dll",
                  "aarch64-windows/d3d11.dll",
                  "aarch64-windows/dxgi.dll",
                  "d3d12/libmetalirconverter.dylib",
                  "prefix-template.tar.gz",
              )
              missing = [name for name in required if prefix + name not in archive.namelist()]
              if missing:
                  raise SystemExit("Missing actual Madeira native IPA resources: " + ", ".join(missing))
              flags = plistlib.loads(archive.read(prefix + "MadeiraRuntimeManifest.plist"))
              if not all(flags.get(key) is True for key in ("fexInProcess", "wineInProcess", "dxmtLinked", "d3d12Linked")):
                  raise SystemExit("Native Madeira manifest is incomplete")
              if "${{ (github.event_name != 'workflow_dispatch' || inputs.build_wow64) && '1' || '0' }}" == "1":
                  if flags.get("wow64Enabled") is not True:
                      raise SystemExit("Native Madeira manifest does not advertise verified WoW64")
                  required_wow64 = (
                      "i386-windows/ntdll.dll",
                      "i386-windows/kernel32.dll",
                      "i386-windows/user32.dll",
                      "i386-windows/d3d11.dll",
                      "i386-windows/dxgi.dll",
                      "aarch64-windows/wow64.dll",
                      "aarch64-windows/wow64win.dll",
                      "aarch64-windows/xtajit.dll",
                  )
                  missing_wow64 = [name for name in required_wow64 if prefix + name not in archive.namelist()]
                  if missing_wow64:
                      raise SystemExit("WoW64 requested but missing: " + ", ".join(missing_wow64))
          print("Confirmed IPA includes Madeira native manifest and Windows runtime payload")
          PY
          fi

      - name: Prepare authorized compiled runtime export
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && inputs.export_runtime_kit && env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE == '1' }}
        env:
          IDECK_BUILD_WOW64: ${{ (github.event_name != 'workflow_dispatch' || inputs.build_wow64) && '1' || '0' }}
          IDECK_BUNDLE_WINE_MONO: ${{ inputs.bundle_wine_mono && '1' || '0' }}
        run: |
          set -euo pipefail
          OPTIONS=()
          if [[ "$IDECK_BUILD_WOW64" == "1" ]]; then OPTIONS+=(--wow64); fi
          if [[ "$IDECK_BUNDLE_WINE_MONO" == "1" ]]; then OPTIONS+=(--mono); fi
          REPO_KIT="$(python3 scripts/madeira_native_kit.py path ${OPTIONS[@]+"${OPTIONS[@]}"})"
          CACHE_KIT="$(python3 scripts/madeira_native_kit.py path --cache ${OPTIONS[@]+"${OPTIONS[@]}"})"
          mkdir -p build/native-kit-export
          if [[ -s "$CACHE_KIT" ]]; then
            cp "$CACHE_KIT" build/native-kit-export/
          elif [[ -s "$REPO_KIT" ]]; then
            cp "$REPO_KIT" build/native-kit-export/
          else
            echo "::error::No compiled Madeira runtime kit exists to export."
            exit 2
          fi

      - name: Upload authorized runtime kit
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && inputs.export_runtime_kit && env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: iDeck-Madeira-precompiled-runtime
          path: build/native-kit-export/madeira-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload native build diagnostics
        if: ${{ always() && env.IDECK_NATIVE_BUILD == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: iDeck-native-build-diagnostics
          path: |
            build.log
            vendor/Madeira/FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
            vendor/Madeira/FEX/build-arm64ec/CMakeFiles/CMakeConfigureLog.yaml
            vendor/Madeira/wine/build-arm64ec/config.log
            vendor/Madeira/dxmt/build-arm64ec/meson-logs/meson-log.txt
            vendor/Madeira/dxmt/build-pe/meson-logs/meson-log.txt
            vendor/Madeira/build/ntdll-unix/obj/*.err
            vendor/Madeira/build/dxmt-ios/obj/*.err
            vendor/Madeira/build/dxmt-ios/build-ideck.log
            vendor/Madeira/build/wineserver/obj/err-*.txt
            vendor/Madeira/wine/build-macos/config.log
            vendor/Madeira/build/gnutls-ios/obj/*.log
            vendor/Madeira/build/ffmpeg/obj/*.log
            vendor/Madeira/build/freetype-ios/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IDECK_NATIVE_BUILD == '1' && 'iDeck-Madeira-native' || 'iDeck-interface-only' }}
          path: iDeck.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Show IPA download instructions
        if: success()
        run: |
          if [[ "${{ env.IDECK_NATIVE_BUILD == '1' && '1' || '0' }}" == "1" ]]; then
            echo '## iDeck Madeira native IPA: static checks passed' >> "$GITHUB_STEP_SUMMARY"
            echo 'The native payload passed build verification, but game execution, JIT and device signing are not verified.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download **iDeck-Madeira-native** under Artifacts.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## iDeck interface-only IPA' >> "$GITHUB_STEP_SUMMARY"
            echo '**Windows games will not run in this IPA. FEX, Wine, DXMT and D3D12 were not compiled or linked.**' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download **iDeck-interface-only** under Artifacts, or manually run this workflow with Require Madeira runtime and the license confirmation.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[Open artifacts for this run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: env.IDECK_NATIVE_BUILD == '1' && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" iDeck.ipa --clobber
          else
            gh release create "$TAG" iDeck.ipa --target "${{ github.sha }}" --title "iDeck $TAG" --generate-notes
          fi

