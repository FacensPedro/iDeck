name: iOS Build

on:
  workflow_dispatch:
    inputs:
      require_madeira:
        description: "Require real FEX/Wine/DXMT/D3D12 binaries and linked bridge (no UI-only IPA)"
        type: boolean
        required: false
        default: true
      graphics_profile:
        description: "Native renderer: D3D11-only does not redistribute the Apple Metal Shader Converter"
        type: choice
        options: [d3d11, d3d12]
        default: d3d11
      accept_converter_license:
        description: "I have reviewed the Metal Shader Converter terms and have permission to package the converter in this IPA"
        type: boolean
        required: false
        default: false
      build_wow64:
        description: "Bundle WoW64 (i386 FEX and Wine) in the native IPA (enabled by default; disable only for 64-bit-only builds)"
        type: boolean
        required: false
        default: true
      bundle_wine_mono:
        description: "Include Wine Mono for compatible .NET Framework applications"
        type: boolean
        required: false
        default: false
      export_runtime_kit:
        description: "Export native runtime ZIP as an artifact for authorized Git LFS storage (requires distribution rights)"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Publish a GitHub release for this tag (e.g. 0.1.0); empty = build only"
        required: false
        default: ""
  push:
    branches: [ "main", "feature/madeira-xinput-hid-restart-multiple-games-20261029", "fix/native-runtime-link-and-llvm-sdk-20261029" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: ideck-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Host and native bridge regression tests
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Setup Node.js 24 for runtime tests
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Verify Node.js 24 test runtime
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(2)'

      - name: Test Metal Toolchain bootstrap
        run: |
          bash -n scripts/ensure_metal_toolchain.sh
          python3 -m unittest discover -s tests/host -p 'test_metal_toolchain.py' -v

      - name: Test Madeira first-frame, safe Wine close and localized controls
        run: python3 -m unittest discover -s tests/host -p 'test_madeira_black_screen_close_i18n.py' -v

      - name: Test native Wine and graphics static ABI and missing-symbol rejection
        run: |
          python3 -m unittest discover -s tests/host -p 'test_wine_static_link.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_graphics_static_link.py' -v

      - name: Test complete LLVM SDK cache restoration
        run: python3 -m unittest discover -s tests/host -p 'test_llvm_ios_sdk.py' -v

      - name: Verify iPhoneOS LLVM linker system libraries
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -arch arm64 -isysroot "$SDK" \
            -miphoneos-version-min=18.0 \
            tests/host/NativeIOSLinkDependencies.c \
            -lcurses -lxml2 -o /tmp/ideck-ios-llvm-dependency-check
          test "$(xcrun lipo -archs /tmp/ideck-ios-llvm-dependency-check)" = arm64
          python3 -m unittest discover -s tests/host -p 'test_native_llvm_link.py' -v

      - name: Prevent Swift translation dictionary crash at iDeck launch
        run: |
          python3 -m unittest discover -s tests/host -p 'test_localization_dictionary.py' -v
          xcrun swiftc iDeck/Localization.swift tests/host/LocalizationLaunchSmokeTests.swift -o /tmp/ideck-localization-launch-tests
          /tmp/ideck-localization-launch-tests

      - name: Test direct IPA downloads and in-app updates
        run: |
          python3 -m unittest discover -s tests/host -p 'test_direct_ipa_updater_clipboard.py' -v
          xcrun swiftc iDeck/WineLogClipboard.swift tests/host/WineLogClipboardTests.swift -o /tmp/ideck-wine-log-clipboard-tests
          /tmp/ideck-wine-log-clipboard-tests

      - name: Test automatic Wine JIT, Steam cancellation, and in-game performance overlay
        run: python3 -m unittest discover -s tests/host -p 'test_automatic_jit_download_hud.py' -v

      - name: Test automatic Windows runtime settings
        run: python3 -m unittest discover -s tests/host -p 'test_windows_compatibility_localization.py' -v

      - name: Test DXMT shader compatibility patch
        run: |
          bash -n scripts/fetch_madeira_sources.sh
          bash -n scripts/build_madeira_components.sh
          python3 -m unittest discover -s tests/host -p 'test_dxmt_shader_patch.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_game_backports.py' -v

      - name: Test native ARM64EC syscall context restoration
        run: |
          python3 -m unittest discover -s tests/host -p 'test_arm64ec_mach_slowpath.py' -v
          python3 -m unittest discover -s tests/host -p 'test_arm64ec_mach_compile.py' -v
          bash -n scripts/fetch_madeira_sources.sh
          bash -n scripts/build_ipa.sh

      - name: Test StikDebug universal JIT register encoding
        run: node tests/host/universal_jit_register_tests.js

      - name: Test app cold-start isolation and crash-recovery entry
        run: python3 -m unittest discover -s tests/host -p 'test_launch_startup_isolation.py' -v

      - name: Test GNU Bison Wine build preflight
        run: |
          bash -n scripts/ensure_madeira_bison.sh
          python3 -m unittest discover -s tests/host -p 'test_madeira_bison_preflight.py' -v

      - name: Test FEX iOS allocator archive preparation
        run: |
          bash -n scripts/build_fex_ios_allocator.sh
          python3 -m unittest discover -s tests/host -p 'test_fex_ios_allocator.py' -v

      - name: Test Madeira native symbol ownership
        run: |
          bash -n scripts/link_madeira_native.sh
          python3 -m unittest discover -s tests/host -p 'test_madeira_native_duplicate_symbols.py' -v


      - name: Test native performance C++ modules
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread -x c++ \
            tests/host/NativePerformanceTests.cpp \
            iDeck/NativeRuntime/FEXExecutionScheduler.cpp \
            iDeck/NativeRuntime/GuestMemoryPool.cpp \
            iDeck/NativeRuntime/NativePerformanceClock.cpp \
            iDeck/NativeRuntime/RuntimePerformanceMonitor.mm \
            -o /tmp/ideck-native-performance-tests
          /tmp/ideck-native-performance-tests

      - name: Test native memory budgeting and pressure recovery
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread \
            tests/host/NativeMemoryManagerTests.cpp \
            iDeck/NativeRuntime/NativeMemoryManager.cpp \
            iDeck/NativeRuntime/GuestMemoryPool.cpp \
            -o /tmp/ideck-memory-manager-tests
          /tmp/ideck-memory-manager-tests

      - name: Test live debugger guard for FEX JIT
        run: |
          xcrun clang++ -std=c++20 -O2 -pthread \
            tests/host/FEXJITGuardTests.cpp \
            iDeck/NativeRuntime/FEXRuntime.cpp \
            -o /tmp/ideck-fex-jit-guard-tests
          /tmp/ideck-fex-jit-guard-tests
          python3 -m unittest discover -s tests/host -p 'test_fex_jit_guard.py' -v
          python3 -m unittest discover -s tests/host -p 'test_auto_wine_jit_pool.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_arm_host_features.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_ui_jit_upstream.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_jit_stage7.py' -v

      - name: Validate Xcode project source references
        run: python3 -m unittest discover -s tests/host -p 'test_xcode_project.py' -v

      - name: Verify iPhone Duo Metal scenes, compact UI and stage acceptance
        run: python3 -m unittest discover -s tests/host -p 'test_iphone_duo_layout.py' -v

      - name: Verify D3D11-only source, strict bundle and payload tests
        run: |
          python3 -m unittest discover -s tests/host -p 'test_verify_madeira_sources.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_d3d11_profile.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_payload_staging.py' -v
          python3 -m unittest discover -s tests/host -p 'test_apple_msc_beta3.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_device_acceptance.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_legal_notices.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_toolchain_gate.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_component_stages.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_component_outputs.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_wine_stage4.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_dxmt_stage5.py' -v

      - name: Test native bundle and signed-app validation
        run: |
          python3 -m unittest discover -s tests/host -p 'test_madeira_bundle.py' -v
          python3 -m unittest discover -s tests/host -p 'test_signed_madeira_app.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_security_entitlements.py' -v

      - name: Verify Windows-compatible native payload staging
        run: |
          bash -n scripts/stage_madeira_payload.sh
          python3 -m unittest discover -s tests/host -p 'test_madeira_payload_staging.py' -v


      - name: Test native regional Steam depot selection
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/SteamDepotRegionPolicyTests.c iDeck/SteamDepotRegionPolicy.c \
            -o /tmp/ideck-steam-region-tests
          /tmp/ideck-steam-region-tests

      - name: Test native Steam disk writer
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/SteamDiskIOTests.c iDeck/SteamDiskIO.c \
            -o /tmp/ideck-steam-disk-tests
          /tmp/ideck-steam-disk-tests

      - name: Test native dispatch WoW64, D3D11 kit cache and D3D12 license gates
        run: python3 -m unittest discover -s tests/host -p 'test_actions_native_dispatch_matrix.py' -v

      - name: Test reusable Madeira kit validation and shell build
        run: |
          python3 -m unittest discover -s tests/host -p 'test_madeira_native_kit.py' -v
          python3 -m unittest discover -s tests/host -p 'test_ipa_optional_arrays.py' -v
          bash -n scripts/build_ipa.sh
          bash -n scripts/build_native_runtime.sh

      - name: Test on-device Visual C++ CAB extraction
        run: |
          set -euo pipefail
          mkdir -p /tmp/ideck-vcrt-objects
          for name in cabd cabc system mszipd lzxd qtmd crc32; do
            xcrun clang -std=c99 -D_POSIX_C_SOURCE=200809L \
              -I iDeck/ThirdParty/libmspack \
              -c "iDeck/ThirdParty/libmspack/$name.c" \
              -o "/tmp/ideck-vcrt-objects/$name.o"
          done
          xcrun clang -std=c99 -D_POSIX_C_SOURCE=200809L \
            -I iDeck/ThirdParty/libmspack \
            -c iDeck/NativeRuntime/VCArchiveExtractor.c \
            -o /tmp/ideck-vcrt-objects/VCArchiveExtractor.o
          xcrun clang -std=c99 -I . -c tests/host/VisualCRuntimeCABHostTests.c \
            -o /tmp/ideck-vcrt-objects/VisualCRuntimeCABHostTests.o
          xcrun clang /tmp/ideck-vcrt-objects/*.o -o /tmp/ideck-vcrt-extractor-tests
          python3 tests/host/test_vcrt_cab_extractor.py /tmp/ideck-vcrt-extractor-tests
          xcrun swiftc -import-objc-header iDeck/NativeRuntime/VCArchiveExtractor.h \
            iDeck/VisualCRuntimeBootstrap.swift tests/host/VisualCRuntimeBootstrapTests.swift \
            /tmp/ideck-vcrt-objects/cabd.o /tmp/ideck-vcrt-objects/cabc.o \
            /tmp/ideck-vcrt-objects/system.o /tmp/ideck-vcrt-objects/mszipd.o \
            /tmp/ideck-vcrt-objects/lzxd.o /tmp/ideck-vcrt-objects/qtmd.o \
            /tmp/ideck-vcrt-objects/crc32.o \
            /tmp/ideck-vcrt-objects/VCArchiveExtractor.o -o /tmp/ideck-vcredist-tests
          /tmp/ideck-vcredist-tests

      - name: Test Steam native C crypto and bounded existing-file verification
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/SteamNativeCoreTests.c iDeck/SteamNativeCore.c \
            -o /tmp/ideck-steam-native-tests
          /tmp/ideck-steam-native-tests
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -c iDeck/SteamNativeCore.c \
            -o /tmp/ideck-steam-native-core.o
          xcrun swiftc -import-objc-header iDeck/SteamNativeCore.h \
            iDeck/SteamExistingChunkVerifier.swift tests/host/SteamExistingChunkVerifierTests.swift \
            /tmp/ideck-steam-native-core.o -o /tmp/ideck-steam-existing-chunk-tests
          /tmp/ideck-steam-existing-chunk-tests

      - name: Test bounded native Madeira Wine log diagnostics
        run: |
          xcrun clang -std=c11 -D_DARWIN_C_SOURCE -O2 -Wall -Wextra -Werror \
            tests/host/WineLogTriageTests.c iDeck/NativeRuntime/WineLogTriage.c \
            -o /tmp/ideck-wine-diagnosis-tests
          /tmp/ideck-wine-diagnosis-tests
          python3 -m unittest discover -s tests/host -p 'test_native_steam_performance.py' -v

      - name: Test Steam CDN host performance selection
        run: |
          xcrun swiftc iDeck/SteamCDNHostSelection.swift tests/host/SteamCDNHostSelectionTests.swift -o /tmp/ideck-cdn-selection-tests
          /tmp/ideck-cdn-selection-tests
          python3 -m unittest discover -s tests/host -p 'test_steam_ip_routing.py' -v

      - name: Test graphics DLL override isolation
        run: |
          xcrun swiftc iDeck/GraphicsConfig.swift tests/host/GraphicsOverrideTests.swift -o /tmp/ideck-graphics-override-tests
          /tmp/ideck-graphics-override-tests
          python3 -m unittest discover -s tests/host -p 'test_wine_11_4_d3d12_dxvk_hud.py' -v

      - name: Test Wine game loading and safe close
        run: python3 -m unittest discover -s tests/host -p 'test_wine_startup_session.py' -v

      - name: Test Wine native exit diagnostics and Steam app identity
        run: |
          xcrun swiftc iDeck/WineExitDiagnostics.swift tests/host/WineExitDiagnosticsTests.swift -o /tmp/ideck-wine-exit-tests
          /tmp/ideck-wine-exit-tests
          python3 -m unittest discover -s tests/host -p 'test_madeira_launch_integration.py' -v

      - name: Test installed Steam executable and working-directory launch paths
        run: |
          xcrun swiftc iDeck/SteamKeyValues.swift iDeck/SteamInstall.swift tests/host/SteamInstallLaunchPathTests.swift -o /tmp/ideck-steam-launch-path-tests
          /tmp/ideck-steam-launch-path-tests
          python3 -m unittest discover -s tests/host -p 'test_steam_install_progress_size.py' -v

      - name: Test Windows launch arguments and path escaping
        run: |
          xcrun swiftc iDeck/WindowsLaunchArguments.swift tests/host/WindowsLaunchArgumentsTests.swift -o /tmp/ideck-launch-args-tests
          /tmp/ideck-launch-args-tests

      - name: Test live Madeira virtual monitor, four surface scaling modes and touch mapping
        run: python3 -m unittest discover -s tests/host -p 'test_madeira_surface_scaling.py' -v

      - name: Test native window-level Metal display and fast Wine startup
        run: python3 -m unittest discover -s tests/host -p 'test_wine_black_screen_fast_start.py' -v

      - name: Test Madeira XInput/HID controller integration and repeat Wine sessions
        run: |
          python3 -m unittest discover -s tests/host -p 'test_madeira_xinput_hid_restart.py' -v
          xcrun --sdk iphoneos clang++ -std=c++20 -fobjc-arc -fsyntax-only \
            -target arm64-apple-ios18.0 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            iDeck/NativeRuntime/DirectInputBridge.mm

      - name: Test coordinated Wine shutdown and Steam library return
        run: python3 -m unittest discover -s tests/host -p 'test_wine_shutdown_library_return.py' -v

      - name: Test Steam WebSocket backpressure and graphics readiness diagnostics
        run: python3 -m unittest discover -s tests/host -p 'test_steam_game_launch_diagnostics.py' -v

      - name: Test Husk IPA ZIP extraction
        run: |
          xcrun swiftc iDeck/IPAArchivePath.swift tests/host/IPAArchivePathTests.swift -o /tmp/ideck-ipa-path-tests
          /tmp/ideck-ipa-path-tests
          python3 -m unittest discover -s tests/host -p 'test_husk_zip_extractor.py' -v

      - name: Test rendering configuration and window resizing
        run: |
          xcrun swiftc iDeck/RuntimeConfiguration.swift tests/host/RuntimeConfigurationTests.swift -o /tmp/ideck-runtime-tests
          /tmp/ideck-runtime-tests

      - name: Test Steam library preview cache
        run: |
          xcrun swiftc iDeck/SteamLibraryPreviewCache.swift tests/host/SteamLibraryPreviewCacheTests.swift -o /tmp/ideck-steam-library-cache-tests
          /tmp/ideck-steam-library-cache-tests

      - name: Test guest data containers
        run: |
          xcrun swiftc iDeck/GuestContainerStore.swift tests/host/GuestContainerStoreTests.swift -o /tmp/ideck-container-tests
          /tmp/ideck-container-tests

      - name: Test automated GitHub Release activation and runtime safety
        run: python3 -m unittest discover -s tests/host -p 'test_automatic_ipa_release.py' -v

      - name: Test Node.js 24, Madeira LuaJIT/DirectComposition, and graphics source backports
        run: |
          python3 -m unittest discover -s tests/host -p 'test_madeira_vulkan_gl_luajit_backports.py' -v
          python3 -m unittest discover -s tests/host -p 'test_madeira_wow64_import_closure.py' -v
          bash -n scripts/build_madeira_dcomp.sh
          bash -n scripts/build_madeira_luajit.sh

      - name: Test fast direct IPA packaging
        run: python3 -m unittest discover -s tests/host -p 'test_fast_ipa_packaging.py' -v

  build:
    name: Build iDeck IPA
    runs-on: xcode-27
    outputs:
      ipa_kind: ${{ steps.detect_ipa_kind.outputs.kind }}
      ipa_artifact_url: ${{ steps.ipa_artifact.outputs.artifact-url }}
      graphics_backend: ${{ steps.detect_ipa_kind.outputs.graphics_backend }}
    # Untrusted PRs build the interface only. Main and release tags build
    # the fully native runtime only after the owner explicitly authorizes
    # Metal Shader Converter and third-party redistribution in Actions vars.
    env:
      IDECK_REQUIRE_IPHONE_DUO_SDK: '1'
      IDECK_NATIVE_BUILD: ${{ ((github.event_name == 'workflow_dispatch' && inputs.require_madeira) || (github.event_name == 'push' && vars.IDECK_NATIVE_DISTRIBUTION_APPROVED == 'true')) && '1' || '0' }}
      IDECK_BUILD_WOW64: ${{ ((github.event_name == 'workflow_dispatch' && inputs.require_madeira && inputs.build_wow64) || (github.event_name == 'push' && vars.IDECK_NATIVE_DISTRIBUTION_APPROVED == 'true')) && '1' || '0' }}
      IDECK_BUNDLE_WINE_MONO: ${{ github.event_name == 'workflow_dispatch' && inputs.require_madeira && inputs.bundle_wine_mono && '1' || '0' }}
      IDECK_MADEIRA_GRAPHICS: ${{ github.event_name == 'workflow_dispatch' && inputs.graphics_profile || 'd3d12' }}
      IDECK_ACCEPT_METAL_CONVERTER_LICENSE: ${{ (((github.event_name == 'workflow_dispatch' && inputs.accept_converter_license) || (github.event_name == 'push' && vars.IDECK_NATIVE_DISTRIBUTION_APPROVED == 'true')) && (github.event_name != 'workflow_dispatch' || inputs.graphics_profile == 'd3d12')) && '1' || '0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Validate native runtime requirements
        if: ${{ env.IDECK_NATIVE_BUILD == '1' }}
        env:
          CONVERTER_LICENSE_ACK: ${{ env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE }}
        run: |
          set -euo pipefail
          if [[ "$IDECK_MADEIRA_GRAPHICS" == "d3d12" && "$CONVERTER_LICENSE_ACK" != "1" ]]; then
            echo "::error::Native build requires reviewing the Apple Metal Shader Converter license and explicitly confirming permission to package the converter."
            exit 2
          fi

      - name: Restore incremental Xcode build intermediates
        uses: actions/cache@v5
        with:
          path: |
            build/Build/Intermediates.noindex
            build/Build/Products
            build/ModuleCache.noindex
          key: ideck-xcode-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.IDECK_NATIVE_BUILD }}-${{ env.IDECK_MADEIRA_GRAPHICS }}-${{ hashFiles('iDeck.xcodeproj/project.pbxproj', 'iDeck/**/*.swift', 'iDeck/**/*.m', 'iDeck/**/*.mm', 'iDeck/**/*.c', 'iDeck/**/*.cpp', 'iDeck/**/*.h', 'scripts/link_madeira_native.sh', 'patches/**') }}
          restore-keys: |
            ideck-xcode-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.IDECK_NATIVE_BUILD }}-${{ env.IDECK_MADEIRA_GRAPHICS }}-

      - name: Restore previously compiled Madeira runtime
        id: madeira_cache
        if: ${{ env.IDECK_NATIVE_BUILD == '1' }}
        uses: actions/cache@v5
        with:
          path: build/native-cache
          key: madeira-kit-v3-${{ runner.os }}-${{ runner.arch }}-${{ env.IDECK_MADEIRA_GRAPHICS }}-${{ env.IDECK_BUILD_WOW64 == '1' && 'wow64' || 'no-wow64' }}-${{ env.IDECK_BUNDLE_WINE_MONO == '1' && 'mono' || 'no-mono' }}-${{ hashFiles('scripts/madeira_native_kit.py', 'scripts/build_madeira_components.sh', 'scripts/build_madeira_dcomp.sh', 'scripts/build_madeira_luajit.sh', 'scripts/link_madeira_native.sh', 'scripts/fetch_madeira_sources.sh', 'build/dcomp/*', 'build/wineserver/*', 'patches/*') }}

      - name: Locate repository or cached Madeira runtime
        if: ${{ env.IDECK_NATIVE_BUILD == '1' }}
        id: madeira_kit
        run: |
          set -euo pipefail
          OPTIONS=(--graphics "$IDECK_MADEIRA_GRAPHICS")
          if [[ "$IDECK_BUILD_WOW64" == "1" ]]; then OPTIONS+=(--wow64); fi
          if [[ "$IDECK_BUNDLE_WINE_MONO" == "1" ]]; then OPTIONS+=(--mono); fi
          SOURCE="$(python3 scripts/madeira_native_kit.py path ${OPTIONS[@]+"${OPTIONS[@]}"})"
          CACHE="$(python3 scripts/madeira_native_kit.py path --cache ${OPTIONS[@]+"${OPTIONS[@]}"})"
          FOUND=""
          for ARCHIVE in "$SOURCE" "$CACHE"; do
            if [[ -s "$ARCHIVE" ]] &&
               python3 scripts/madeira_native_kit.py inspect --archive "$ARCHIVE" ${OPTIONS[@]+"${OPTIONS[@]}"} >/dev/null 2>&1; then
              FOUND="$ARCHIVE"
              break
            fi
            if [[ -s "$ARCHIVE" ]]; then
              echo "Discarding stale or incompatible native kit for $IDECK_MADEIRA_GRAPHICS: $ARCHIVE"
            fi
          done
          if [[ -n "$FOUND" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Verified native kit including the ARM64EC Mach context return: $FOUND"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No matching patched runtime kit. Rebuilding Madeira/FEX/Wine and caching the new binaries."
          fi

      - name: Install and validate Metal Toolchain
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: bash scripts/ensure_metal_toolchain.sh

      - name: Install Madeira native build dependencies
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: |
          set -euo pipefail
          MISSING=()
          for pair in cmake:cmake ninja:ninja meson:meson pkg-config:pkg-config; do
            tool="${pair%%:*}"
            package="${pair#*:}"
            command -v "$tool" >/dev/null 2>&1 || MISSING+=("$package")
          done
          if (( ${#MISSING[@]} )); then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${MISSING[@]}"
          fi
          # The system bison exists on macOS but is 2.3 (not Wine-compatible).
          # This step tests the version, installs Homebrew Bison 3+, and
          # persists its bin directory to PATH for all later Actions steps.
          bash scripts/ensure_madeira_bison.sh

      - name: Verify Wine parser prerequisites before compiling LLVM
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: |
          set -euo pipefail
          bash scripts/ensure_madeira_bison.sh
          bison --version | head -n 1

      - name: Fetch pinned Madeira with FEX, Wine and DXMT
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: bash scripts/fetch_madeira_sources.sh

      - name: Restore precompiled ARM64EC and iOS LLVM toolchains
        id: native_toolchains
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        uses: actions/cache/restore@v5
        with:
          path: |
            vendor/Madeira/toolchains/llvm-mingw-20260421-ucrt-macos-universal
            vendor/Madeira/toolchains/llvm-ios-build
          key: madeira-toolchains-v2-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare_madeira_toolchains.sh', 'scripts/llvm_ios_sdk.py') }}
          restore-keys: |
            madeira-toolchains-v2-xcode27-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore compiled Wine native prerequisites
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        uses: actions/cache@v5
        with:
          path: |
            vendor/Madeira/toolchains/gnutls-ios
            vendor/Madeira/toolchains/ffmpeg-ios
            vendor/Madeira/research/freetype
            vendor/Madeira/build/freetype-ios/build
          key: madeira-deps-v1-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare_madeira_dependencies.sh') }}

      - name: Prepare ARM64EC and iOS LLVM toolchains
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' }}
        run: bash scripts/prepare_madeira_toolchains.sh

      # Save the expensive public cross-toolchains immediately. A later
      # Wine/FEX/DXMT compile failure must not force rebuilding LLVM again.
      - name: Save compiled ARM64EC and iOS LLVM toolchains
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && steps.madeira_kit.outputs.available != 'true' && steps.native_toolchains.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            vendor/Madeira/toolchains/llvm-mingw-20260421-ucrt-macos-universal
            vendor/Madeira/toolchains/llvm-ios-build
          key: ${{ steps.native_toolchains.outputs.cache-primary-key }}

      - name: Build and package iDeck.ipa
        env:
          IDECK_REQUIRE_MADEIRA: ${{ env.IDECK_NATIVE_BUILD }}
          IDECK_ACCEPT_METAL_CONVERTER_LICENSE: ${{ env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE }}
          IDECK_PREBUILT_EXPORT: ${{ env.IDECK_NATIVE_BUILD == '1' && '1' || '0' }}
          IDECK_PREBUILT_MODE: prefer
          IDECK_MADEIRA_GRAPHICS: ${{ env.IDECK_MADEIRA_GRAPHICS }}
          IDECK_CONFIGURATION: ${{ env.IDECK_NATIVE_BUILD == '1' && 'Debug' || 'Release' }}
        run: |
          set -o pipefail
          bash scripts/build_ipa.sh 2>&1 | tee build.log || status=$?
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          exit ${status:-0}

      - name: Verify IPA archive
        run: |
          test -s iDeck.ipa
          unzip -tq iDeck.ipa
          unzip -Z1 iDeck.ipa | grep -Fx 'Payload/iDeck.app/universal.js'
          if [[ "${{ env.IDECK_NATIVE_BUILD == '1' && '1' || '0' }}" == "1" ]]; then
            python3 - <<'PY'
          import os
          import plistlib
          from zipfile import ZipFile

          with ZipFile("iDeck.ipa") as archive:
              prefix = "Payload/iDeck.app/"
              required = (
                  "MadeiraRuntimeManifest.plist",
                  "arm64ec-windows/xtajit64.dll",
                  "arm64ec-windows/winemetal.dll",
                  "arm64ec-windows/d3d11.dll",
                  "arm64ec-windows/dxgi.dll",
                  "arm64ec-windows/d3d10core.dll",
                  "arm64ec-windows/dcomp.dll",
                  "arm64ec-windows/ktmw32.dll",
                  "arm64ec-windows/faultrep.dll",
                  "arm64ec-windows/xaudio2_7.dll",
                  "arm64ec-windows/d3dx11_43.dll",
                  "arm64ec-windows/d3dcompiler_47.dll",
                  "arm64ec-windows/dinput8.dll",
                  "aarch64-windows/d3d11.dll",
                  "aarch64-windows/dxgi.dll",
                  "prefix-template.tar.gz",
              )
              backend = os.environ["IDECK_MADEIRA_GRAPHICS"]
              if backend == "d3d12":
                  required += ("arm64ec-windows/madeira_d3d12.dll",
                               "arm64ec-windows/d3d12.dll",
                               "arm64ec-windows/d3d12core.dll",
                               "d3d12/libmetalirconverter.dylib")
              missing = [name for name in required if prefix + name not in archive.namelist()]
              if missing:
                  raise SystemExit("Missing actual Madeira native IPA resources: " + ", ".join(missing))
              flags = plistlib.loads(archive.read(prefix + "MadeiraRuntimeManifest.plist"))
              if not all(flags.get(key) is True for key in ("fexInProcess", "wineInProcess", "dxmtLinked")):
                  raise SystemExit("Native Madeira manifest is incomplete")
              if flags.get("graphicsBackend") != backend or flags.get("d3d12Linked") is not (backend == "d3d12"):
                  raise SystemExit("Native Madeira graphics profile mismatch")
              if backend == "d3d11":
                  forbidden = ("arm64ec-windows/madeira_d3d12.dll",
                               "arm64ec-windows/d3d12.dll",
                               "arm64ec-windows/d3d12core.dll",
                               "aarch64-windows/d3d12.dll")
                  leaked = [item for item in archive.namelist()
                            if "libmetalirconverter.dylib" in item or
                            (item.startswith(prefix) and any(item.endswith("/" + name) for name in forbidden))]
                  if leaked:
                      raise SystemExit("D3D11 IPA contains forbidden D3D12 assets: " + ", ".join(leaked))
              if os.environ["IDECK_BUILD_WOW64"] == "1":
                  if flags.get("wow64Enabled") is not True:
                      raise SystemExit("Native Madeira manifest does not advertise verified WoW64")
                  required_wow64 = (
                      "i386-windows/ntdll.dll",
                      "i386-windows/kernel32.dll",
                      "i386-windows/user32.dll",
                      "i386-windows/d3d11.dll",
                      "i386-windows/dxgi.dll",
                      "aarch64-windows/wow64.dll",
                      "aarch64-windows/wow64win.dll",
                      "aarch64-windows/xtajit.dll",
                  )
                  missing_wow64 = [name for name in required_wow64 if prefix + name not in archive.namelist()]
                  if missing_wow64:
                      raise SystemExit("WoW64 requested but missing: " + ", ".join(missing_wow64))
          print("Confirmed IPA includes Madeira native manifest and Windows runtime payload")
          PY
          fi

      - name: Prepare authorized compiled runtime export
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && env.IDECK_MADEIRA_GRAPHICS == 'd3d12' && inputs.export_runtime_kit && env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE == '1' }}
        env:
        run: |
          set -euo pipefail
          OPTIONS=(--graphics "$IDECK_MADEIRA_GRAPHICS")
          if [[ "$IDECK_BUILD_WOW64" == "1" ]]; then OPTIONS+=(--wow64); fi
          if [[ "$IDECK_BUNDLE_WINE_MONO" == "1" ]]; then OPTIONS+=(--mono); fi
          REPO_KIT="$(python3 scripts/madeira_native_kit.py path ${OPTIONS[@]+"${OPTIONS[@]}"})"
          CACHE_KIT="$(python3 scripts/madeira_native_kit.py path --cache ${OPTIONS[@]+"${OPTIONS[@]}"})"
          mkdir -p build/native-kit-export
          if [[ -s "$CACHE_KIT" ]]; then
            cp "$CACHE_KIT" build/native-kit-export/
          elif [[ -s "$REPO_KIT" ]]; then
            cp "$REPO_KIT" build/native-kit-export/
          else
            echo "::error::No compiled Madeira runtime kit exists to export."
            exit 2
          fi

      - name: Upload authorized runtime kit
        if: ${{ env.IDECK_NATIVE_BUILD == '1' && env.IDECK_MADEIRA_GRAPHICS == 'd3d12' && inputs.export_runtime_kit && env.IDECK_ACCEPT_METAL_CONVERTER_LICENSE == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: iDeck-Madeira-precompiled-runtime
          path: build/native-kit-export/madeira-*.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload native build diagnostics
        if: ${{ always() && env.IDECK_NATIVE_BUILD == '1' }}
        uses: actions/upload-artifact@v7
        with:
          name: iDeck-native-build-diagnostics
          path: |
            build.log
            vendor/Madeira/FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
            vendor/Madeira/FEX/build-arm64ec/CMakeFiles/CMakeConfigureLog.yaml
            vendor/Madeira/wine/build-arm64ec/config.log
            vendor/Madeira/dxmt/build-arm64ec/meson-logs/meson-log.txt
            vendor/Madeira/dxmt/build-pe/meson-logs/meson-log.txt
            vendor/Madeira/build/ntdll-unix/obj/*.err
            vendor/Madeira/build/dxmt-ios/obj/*.err
            vendor/Madeira/build/dxmt-ios/build-ideck.log
            vendor/Madeira/build/wineserver/obj/err-*.txt
            vendor/Madeira/wine/build-macos/config.log
            vendor/Madeira/build/gnutls-ios/obj/*.log
            vendor/Madeira/build/ffmpeg/obj/*.log
            vendor/Madeira/build/freetype-ios/build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 14

      - name: Identify verified IPA runtime
        id: detect_ipa_kind
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from zipfile import ZipFile

          with ZipFile("iDeck.ipa") as archive:
              manifest_path = "Payload/iDeck.app/MadeiraRuntimeManifest.plist"
              if manifest_path not in archive.namelist():
                  kind = "interface"
                  backend = "none"
              else:
                  info = plistlib.loads(archive.read(manifest_path))
                  required = ("fexInProcess", "wineInProcess", "dxmtLinked")
                  if not all(info.get(field) is True for field in required):
                      raise SystemExit("Incomplete Madeira native manifest; release refused")
                  backend = info.get("graphicsBackend")
                  if backend not in ("d3d11", "d3d12") or info.get("d3d12Linked") is not (backend == "d3d12"):
                      raise SystemExit("Incomplete or dishonest Madeira graphics manifest")
                  if backend == "d3d11" and any("libmetalirconverter.dylib" in name for name in archive.namelist()):
                      raise SystemExit("D3D11 IPA unexpectedly contains Apple's converter")
                  kind = "native"
          if os.environ["IDECK_NATIVE_BUILD"] == "1" and kind != "native":
              raise SystemExit("Native runtime requested but the packaged IPA is interface-only")
          if kind == "native" and backend != os.environ["IDECK_MADEIRA_GRAPHICS"]:
              raise SystemExit("Native IPA graphics profile differs from requested build")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"kind={kind}\n")
              output.write(f"graphics_backend={backend}\n")
          print(f"Verified IPA runtime: {kind}")
          PY

      - name: Upload IPA directly (no outer ZIP)
        id: ipa_artifact
        uses: actions/upload-artifact@v7
        with:
          path: iDeck.ipa
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Show IPA download instructions
        if: success()
        env:
          NATIVE_CACHE_HIT: ${{ steps.madeira_cache.outputs.cache-hit || 'false' }}
          NATIVE_KIT_FOUND: ${{ steps.madeira_kit.outputs.available || 'false' }}
        run: |
          echo "Native runtime: $IDECK_NATIVE_BUILD; graphics: $IDECK_MADEIRA_GRAPHICS; WoW64: $IDECK_BUILD_WOW64; Wine Mono: $IDECK_BUNDLE_WINE_MONO; converter license: $IDECK_ACCEPT_METAL_CONVERTER_LICENSE; kit cache: $NATIVE_CACHE_HIT; verified kit: $NATIVE_KIT_FOUND" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ env.IDECK_NATIVE_BUILD == '1' && '1' || '0' }}" == "1" ]]; then
            echo '## iDeck Madeira native IPA: static checks passed' >> "$GITHUB_STEP_SUMMARY"
            echo 'The native payload passed build verification, but game execution, JIT and device signing are not verified.' >> "$GITHUB_STEP_SUMMARY"
            echo "Kit: ${NATIVE_KIT_FOUND}; Actions cache: ${NATIVE_CACHE_HIT}; WoW64: ${IDECK_BUILD_WOW64}; Mono: ${IDECK_BUNDLE_WINE_MONO}; converter license acknowledged: ${IDECK_ACCEPT_METAL_CONVERTER_LICENSE}" >> "$GITHUB_STEP_SUMMARY"
            echo "Selected graphics backend: $IDECK_MADEIRA_GRAPHICS" >> "$GITHUB_STEP_SUMMARY"
            echo 'Download **iDeck.ipa** directly under Artifacts; the file is not wrapped in another ZIP.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## iDeck interface-only IPA' >> "$GITHUB_STEP_SUMMARY"
            echo '**Windows games will not run in this IPA. FEX, Wine, DXMT and D3D12 were not compiled or linked.**' >> "$GITHUB_STEP_SUMMARY"
            echo 'Download **iDeck.ipa** directly under Artifacts. This is interface-only; enable the native runtime and confirm the license before building a game-capable IPA.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "[Download iDeck.ipa directly](${{ steps.ipa_artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open all artifacts](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
          echo 'An IPA is internally a ZIP-formatted iOS app package. The new artifact removes only the extra GitHub ZIP wrapper.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: ${{ github.event_name == 'pull_request' && 'Verify PR iDeck IPA preview' || 'Publish verified iDeck IPA release' }}
    needs: [checks, build]
    # Every PR gets a final, read-only IPA verification and an artifact link.
    # Only main, version tags, or manual release requests may publish a
    # GitHub Release; PR content never gets to execute the release command.
    if: ${{ needs.checks.result == 'success' && needs.build.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified iDeck IPA directly
        uses: actions/download-artifact@v8
        with:
          name: iDeck.ipa

      - name: Verify IPA before release
        env:
          EXPECTED_KIND: ${{ needs.build.outputs.ipa_kind }}
        run: |
          set -euo pipefail
          test -s iDeck.ipa
          unzip -tq iDeck.ipa
          python3 - <<'PY'
          import os
          import plistlib
          from zipfile import ZipFile

          kind = os.environ["EXPECTED_KIND"]
          if kind not in ("native", "interface"):
              raise SystemExit(f"Missing or invalid verified IPA kind: {kind!r}")
          with ZipFile("iDeck.ipa") as archive:
              manifest = "Payload/iDeck.app/MadeiraRuntimeManifest.plist"
              has_manifest = manifest in archive.namelist()
              if has_manifest != (kind == "native"):
                  raise SystemExit("IPA native manifest does not match the verified build")
              if has_manifest:
                  info = plistlib.loads(archive.read(manifest))
                  for field in ("fexInProcess", "wineInProcess", "dxmtLinked"):
                      if info.get(field) is not True:
                          raise SystemExit(f"Invalid native runtime declaration: {field}")
                  backend = info.get("graphicsBackend")
                  if backend not in ("d3d11", "d3d12") or info.get("d3d12Linked") is not (backend == "d3d12"):
                      raise SystemExit("Invalid signed native graphics profile")
                  if backend == "d3d11" and any("libmetalirconverter.dylib" in name for name in archive.namelist()):
                      raise SystemExit("Refusing release of D3D11 IPA containing Apple converter")
          print(f"Release artifact verified: {kind}")
          PY

      - name: Provide verified IPA to pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          IPA_URL: ${{ needs.build.outputs.ipa_artifact_url }}
          IPA_KIND: ${{ needs.build.outputs.ipa_kind }}
        run: |
          set -euo pipefail
          [[ "$IPA_URL" == https://github.com/*/actions/runs/*/artifacts/* ]] || {
            echo "::error::The verified IPA artifact download URL was not provided by the build job."
            exit 2
          }
          [[ "$IPA_KIND" == "interface" || "$IPA_KIND" == "native" ]] || {
            echo "::error::The IPA kind was not verified."
            exit 2
          }
          echo '## Pull request IPA verified — available for download' >> "$GITHUB_STEP_SUMMARY"
          echo "Download: [iDeck.ipa (direct artifact)]($IPA_URL)" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$IPA_KIND" == "interface" ]]; then
            echo '**Interface-only IPA:** this PR build does not contain FEX, Wine, DXMT or D3D12 and cannot run Windows games.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Native Madeira IPA:** bundle verification passed, but device signing, JIT and Windows game execution remain unverified.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'A pull request does not create a public GitHub Release.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: ${{ github.event_name != 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          KIND: ${{ needs.build.outputs.ipa_kind }}
          GRAPHICS: ${{ needs.build.outputs.graphics_backend }}
          TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag) || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('ideck-ci-{0}-{1}', github.run_id, github.run_attempt) }}
          AUTO_TAG: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release_tag == '') }}
        run: |
          set -euo pipefail
          [[ "$KIND" == "native" || "$KIND" == "interface" ]] || {
            echo "::error::The IPA type was not verified."
            exit 2
          }
          if [[ "$AUTO_TAG" != "true" && "$KIND" != "native" ]]; then
            echo "::error::Versioned releases require verified Wine/FEX/DXMT/D3D12; this IPA contains only the interface. Request a native build with an authorized converter."
            exit 2
          fi

          if [[ "$KIND" == "native" ]]; then
            [[ "$GRAPHICS" == "d3d11" || "$GRAPHICS" == "d3d12" ]] || {
              echo "::error::Native release missing an audited graphics profile."; exit 2;
            }
            TITLE="iDeck $TAG — Native Madeira $GRAPHICS"
            NOTES="Verified native IPA with FEX, Wine and DXMT ($GRAPHICS). Device/JIT compatibility and signing still require validation."
          else
            TITLE="iDeck $TAG — Interface Only (No Windows Games)"
            NOTES="CI prerelease of the iDeck interface only. This IPA does NOT include Wine, FEX, DXMT or D3D12 and cannot run Windows games."
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$AUTO_TAG" != "true" && "$KIND" != "native" ]]; then
              echo "::error::Refusing to overwrite an existing versioned release with an interface-only IPA."
              exit 2
            fi
            gh release upload "$TAG" iDeck.ipa --clobber
          else
            OPTIONS=(--target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES")
            if [[ "$AUTO_TAG" == "true" || "$KIND" != "native" ]]; then
              OPTIONS+=(--prerelease --latest=false)
            fi
            gh release create "$TAG" iDeck.ipa "${OPTIONS[@]}"
          fi
          echo "Published $KIND IPA under GitHub Release $TAG" >> "$GITHUB_STEP_SUMMARY"
