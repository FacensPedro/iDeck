name: iOS Build

on:
  workflow_dispatch:
    inputs:
      require_madeira:
        description: "Require real FEX/Wine/DXMT/D3D12 binaries and linked bridge (no UI-only IPA)"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Publish a GitHub release for this tag (e.g. 0.1.0); empty = build only"
        required: false
        default: ""
  push:
    branches: [ "main" ]
    tags: [ "v*", "[0-9]*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    name: Build iDeck IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild clean build -project iDeck.xcodeproj -scheme iDeck -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log || status=$?
          # Surface compiler errors as annotations so they are visible without the raw log.
          grep -E "error:" build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line}"; done || true
          exit ${status:-0}

      - name: Package IPA
        run: |
          test -d build/Build/Products/Release-iphoneos/iDeck.app/PlugIns/VPNExtension.appex
          if [ "${{ inputs.require_madeira }}" = "true" ]; then
            python3 scripts/verify_madeira_bundle.py --app build/Build/Products/Release-iphoneos/iDeck.app --require
          else
            python3 scripts/verify_madeira_bundle.py --app build/Build/Products/Release-iphoneos/iDeck.app
          fi
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/iDeck.app Payload/
          zip -qry iDeck.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDeck
          path: iDeck.ipa

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" iDeck.ipa --clobber
          else
            gh release create "$TAG" iDeck.ipa --target "${{ github.sha }}" --title "iDeck $TAG" --generate-notes
          fi
