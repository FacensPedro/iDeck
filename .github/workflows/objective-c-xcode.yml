name: Xcode - Interface Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and analyse iDeck
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0.1'

      - name: Build and Analyze
        run: |
          mkdir -p build
          xcodebuild clean build analyze -project iDeck.xcodeproj -scheme iDeck -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO | xcpretty && exit ${PIPESTATUS[0]}

      - name: Package IPA
        run: |
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/iDeck.app Payload/
          zip -r iDeck.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iDeck-analyze-interface-only
          path: iDeck.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Show IPA download instructions
        if: success()
        run: |
          echo '## iDeck interface-only validation IPA' >> "$GITHUB_STEP_SUMMARY"
          echo '**This build excludes the Madeira/FEX/Wine/DXMT native runtime and cannot launch Windows games.**' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **iDeck-analyze-interface-only** under Artifacts for interface testing only.' >> "$GITHUB_STEP_SUMMARY"
          echo "[Open artifacts for this run](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})" >> "$GITHUB_STEP_SUMMARY"
