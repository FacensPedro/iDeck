name: Madeira Stage 0 — Clean macOS diagnosis

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - scripts/diagnose_madeira_stage0.sh
      - .github/workflows/madeira-stage0.yml
      - scripts/fetch_madeira_sources.sh
      - scripts/verify_madeira_bundle.py
      - docs/MADEIRA_RUNTIME_INTEGRATION.md

permissions:
  contents: read

jobs:
  stage0:
    name: Pinned sources, toolchains, and strict IPA baseline
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - name: Checkout iDeck sources
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select installed iOS 27 Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run actual Stage 0 with no native build flag and no proprietary converter redistribution
        run: bash scripts/diagnose_madeira_stage0.sh

      - name: Archive source revision, dependency inventory, and verifier evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ideck-madeira-stage0-diagnostics
          path: build/diagnostics/madeira-stage0/
          if-no-files-found: warn
          retention-days: 14
