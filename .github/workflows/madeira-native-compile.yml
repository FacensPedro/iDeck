name: Madeira D3D11 native compilation and strict IPA verification

# Native components belong to phases 2–6. Do not block the phase-1
# D3D11-only source/profile PR or burn macOS runner minutes on every commit.
# A maintainer must explicitly trigger the expensive source build.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: madeira-native-d3d11-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Build real FEX, Wine ARM64EC and DXMT without converter
    runs-on: xcode-27
    timeout-minutes: 300
    env:
      IDECK_MADEIRA_GRAPHICS: d3d11
      IDECK_BUILD_WOW64: '0'
      IDECK_MADEIRA_REBUILD: '1'
      IDECK_REQUIRE_MADEIRA: '1'
      IDECK_ACCEPT_METAL_CONVERTER_LICENSE: '0'
      IDECK_PREBUILT_MODE: off
      IDECK_PREBUILT_EXPORT: '0'
      IDECK_CONFIGURATION: Debug
      IDECK_LLVM_JOBS: '3'
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select iOS 27 SDK
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install public native build prerequisites
        run: |
          set -euo pipefail
          missing=()
          for tool in cmake ninja meson pkg-config; do
            command -v "$tool" >/dev/null 2>&1 || missing+=("$tool")
          done
          if (( ${#missing[@]} )); then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${missing[@]}"
          fi
          bash scripts/ensure_madeira_bison.sh
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          df -h .

      - name: Fetch exact published Madeira forks and local patches
        run: bash scripts/fetch_madeira_sources.sh

      - name: Restore cross-built LLVM 15 and ARM64EC toolchain
        id: toolchain
        uses: actions/cache/restore@v5
        with:
          path: |
            vendor/Madeira/toolchains/llvm-mingw-20260421-ucrt-macos-universal
            vendor/Madeira/toolchains/llvm-ios-build
          key: madeira-llvm15-ios-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare_madeira_toolchains.sh', 'scripts/llvm_ios_sdk.py') }}

      - name: Validate complete LLVM iPhoneOS SDK and headers
        run: |
          set -euo pipefail
          bash scripts/prepare_madeira_toolchains.sh
          bash scripts/verify_dxmt_llvm.sh
          echo 'LLVM 15 iPhoneOS headers and static archives verified.' >> "$GITHUB_STEP_SUMMARY"

      - name: Save cross toolchain before building FEX, Wine and DXMT
        if: ${{ steps.toolchain.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            vendor/Madeira/toolchains/llvm-mingw-20260421-ucrt-macos-universal
            vendor/Madeira/toolchains/llvm-ios-build
          key: ${{ steps.toolchain.outputs.cache-primary-key }}

      - name: Build real native D3D11-only Madeira IPA
        run: |
          set -o pipefail
          bash scripts/build_ipa.sh 2>&1 | tee native-build.log

      - name: Verify strict native D3D11 app and linked symbols
        run: |
          set -euo pipefail
          APP=build/Staging/iDeck.app
          test -s "$APP/iDeck"
          python3 scripts/verify_madeira_bundle.py --app "$APP" --require --graphics d3d11
          python3 - "$APP" <<'PY'
          import plistlib
          import re
          import subprocess
          import sys
          from pathlib import Path

          app = Path(sys.argv[1])
          with (app / "MadeiraRuntimeManifest.plist").open("rb") as source:
              manifest = plistlib.load(source)
          if manifest.get("graphicsBackend") != "d3d11" or manifest.get("d3d12Linked") is not False:
              raise SystemExit("D3D11 manifest falsely advertises D3D12")
          images = [app / "iDeck"]
          debug_dylib = app / "iDeck.debug.dylib"
          if debug_dylib.is_file():
              images.append(debug_dylib)
          exports = set()
          for image in images:
              output = subprocess.run(
                  ["xcrun", "nm", "-arch", "arm64", "-gU", str(image)],
                  check=True, capture_output=True, text=True
              ).stdout
              exports.update(re.findall(
                  r"(?m)^.*\s_([A-Za-z][A-Za-z0-9_]*)\s*$", output
              ))
          required = {
              "ideck_madeira_launch_v1", "fex_initialize",
              "wineserver_start", "wineserver_is_ready",
              "wine_process_start", "wine_process_is_running",
              "madeira_get_present_count", "winios_post_key",
          }
          missing = sorted(required - exports)
          if missing:
              raise SystemExit("Real native Mach-O symbols missing: " + ", ".join(missing))
          # The DXMT combined archive may contain an unused D3D12 diagnostic
          # object. D3D11 completeness is determined by the strict payload
          # verifier, not by absence of unrelated diagnostic exports.
          print("Real FEX/Wine/DXMT native symbols verified in linked arm64 Mach-O")
          PY

      - name: Verify final IPA has no proprietary converter or D3D12 payload
        run: |
          set -euo pipefail
          test -s iDeck.ipa
          unzip -tq iDeck.ipa
          python3 - <<'PY'
          from zipfile import ZipFile
          import plistlib
          with ZipFile("iDeck.ipa") as ipa:
              names = ipa.namelist()
              manifest = "Payload/iDeck.app/MadeiraRuntimeManifest.plist"
              if manifest not in names:
                  raise SystemExit("Native IPA has no verified runtime manifest")
              flags = plistlib.loads(ipa.read(manifest))
              if flags.get("graphicsBackend") != "d3d11" or flags.get("d3d12Linked") is not False:
                  raise SystemExit("IPA claims a different graphics backend")
              forbidden = ("d3d12.dll", "d3d12core.dll", "madeira_d3d12.dll",
                           "libmetalirconverter.dylib")
              leaking = [
                  name for name in names
                  if name.startswith("Payload/iDeck.app/")
                  and (name.endswith(forbidden) or "/d3d12/" in name)
              ]
              if leaking:
                  raise SystemExit("IPA contains forbidden D3D12 assets: " + ", ".join(leaking))
          print("Verified real unsigned D3D11-only iDeck IPA")
          PY

      - name: Upload verified unsigned native IPA
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: iDeck-Madeira-D3D11-unsigned.ipa
          path: iDeck.ipa
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload native compiler diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Madeira-D3D11-build-diagnostics
          path: |
            native-build.log
            vendor/Madeira/FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
            vendor/Madeira/FEX/build-arm64ec/CMakeFiles/CMakeConfigureLog.yaml
            vendor/Madeira/wine/build-arm64ec/config.log
            vendor/Madeira/dxmt/build-arm64ec/meson-logs/meson-log.txt
            vendor/Madeira/dxmt/build-pe/meson-logs/meson-log.txt
            vendor/Madeira/build/ntdll-unix/obj/*.err
            vendor/Madeira/build/dxmt-ios/obj/*.err
            vendor/Madeira/build/dxmt-ios/build-ideck.log
            vendor/Madeira/build/wineserver/obj/err-*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Record scope of native verification
        if: success()
        run: |
          echo 'Compiled real public Madeira FEX/Wine/DXMT source and verified strict D3D11 bundle and Mach-O symbols.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The IPA is unsigned. Device provisioning, JIT, Windows first frame, controls, audio and app shutdown require physical testing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'No Apple Metal Shader Converter, D3D12 payload or WoW64 modules are included.' >> "$GITHUB_STEP_SUMMARY"
